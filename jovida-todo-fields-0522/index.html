function u(b64){var s=atob(b64),a=new Uint8Array(s.length),i=0;for(;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function dec(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(ENC.s),iterations:ENC.n,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(ENC.i)},key,u(ENC.c));
  return new TextDecoder().decode(pt);
}
function render(html){document.open();document.write(html);document.close();}
function go(){
  var inp=document.getElementById('pgi'),btn=document.getElementById('pgb'),err=document.getElementById('pge');
  var pw=(inp.value||'').trim();if(!pw)return;
  btn.disabled=true;err.style.display='none';
  dec(pw).then(function(html){try{sessionStorage.setItem('share_pwk',pw);}catch(e){}render(html);})
         .catch(function(){btn.disabled=false;err.style.display='block';inp.value='';inp.focus();});
}
document.getElementById('pgb').addEventListener('click',go);
document.getElementById('pgi').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
(function(){try{var k=sessionStorage.getItem('share_pwk');if(k)dec(k).then(render).catch(function(){});}catch(e){}})();
</script>
