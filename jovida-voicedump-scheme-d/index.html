function b64(s){var bin=atob(s),len=bin.length,bytes=new Uint8Array(len);for(var i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return bytes}
async function go(){
  var p=document.getElementById('pgi').value;
  var e=document.getElementById('pge');
  e.textContent='';
  if(!p){e.textContent='请输入访问密码';return}
  try{
    var keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c));
    document.open();document.write(new TextDecoder().decode(plain));document.close();
  }catch(err){e.textContent='密码不正确'}
}
document.getElementById('pgb').onclick=go;
document.getElementById('pgi').addEventListener('keydown',function(ev){if(ev.key==='Enter')go()});
