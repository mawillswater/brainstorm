function u(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function go(){
  var pw=document.getElementById('pgi').value;
  var err=document.getElementById('pge'); err.textContent='';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(ENC.i)},key,u(ENC.c));
    document.open(); document.write(new TextDecoder().decode(pt)); document.close();
  }catch(e){err.textContent='密码不正确'}
}
document.getElementById('pgb').onclick=go;
document.getElementById('pgi').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
